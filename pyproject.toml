[project]
name = "local-gamepad-viewer"
version = "0.0.1"
description = "Local Gamepad Viewer — FastAPI backend + HTML UI (Phase 0 bootstrap)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "loguru>=0.7.2",
]

[tool.uv]  # optional if you use uv; harmless otherwise
dev-dependencies = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.9",
  "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
