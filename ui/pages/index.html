<!-- Main UI shell.

Provides a minimal control panel and preview frame. Loads JS/CSS from /ui/scripts
and /ui/styles, and interacts with the API endpoints to read/update config and
refresh the live Gamepad Viewer preview.
-->

<!doctype html>
<meta charset="utf-8" />
<title>Custom Gamepad Viewer</title>
<link rel="icon" href="/ui/assets/favicon.png">
<link rel="stylesheet" href="/ui/styles/base.css">

<div class="container">
  <header>
    <div><b>Custom Gamepad Viewer</b></div>
    <nav class="kickers">
      <a href="/ui/pages/check_slot.html" target="_blank">Check Slot</a>
      <a id="link-gpv" href="#" target="_blank">Open in Gamepad Viewer</a>
      <a href="/ui/pages/overlay.html" target="_blank">Overlay (no UI)</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h3>Settings</h3>

      <div class="row">
        <label for="skin">Theme</label>
        <select id="skin"></select>
      </div>

      <div class="row">
        <label for="player">Player</label>
        <select id="player">
          <option value="1">P1</option>
          <option value="2">P2</option>
          <option value="3">P3</option>
          <option value="4">P4</option>
        </select>
        <div class="muted">
          Tip: open “Check Slot” and press a button; it will auto-save the active index and we’ll update here.
        </div>
      </div>

      <div class="row actions">
        <button class="btn primary" id="apply">Apply</button>
        <button class="btn" id="refresh">Refresh Preview</button>
      </div>

      <div class="muted" id="status">Ready.</div>
    </section>

    <section class="card">
      <h3>Gamepad Viewer</h3>
      <div class="preview-wrap">
        <div class="preview-scale">
          <iframe id="gpv" allow="gamepad *; clipboard-read; clipboard-write"></iframe>
        </div>
      </div>
      <div class="muted" id="urls"></div>
    </section>
  </main>
</div>

<script src="/ui/scripts/app.js" type="module"></script>
