<!doctype html>
<meta charset="utf-8"/>
<title>Overlay</title>
<style>
  html,body,iframe { margin:0; border:0; height:100%; width:100%; background:transparent; }
</style>
<iframe id="gpv" src="" allow="gamepad *; clipboard-read; clipboard-write"></iframe>

<script>
const frame = document.getElementById('gpv');

async function refresh(force = false) {
  try {
    const r = await fetch('/api/config', { cache:'no-store' });
    if (!r.ok) return;
    const cfg = await r.json();

    if (force) {
      // Force GPV to re-fetch CSS (vars.css changed when theme changes)
      const url = cfg.gpv_url + (cfg.gpv_url.includes('#') ? `&r=${Date.now()}` : `#r=${Date.now()}`);
      frame.src = 'about:blank';
      setTimeout(() => { frame.src = url; }, 30);
    } else {
      // Only change if URL differs (useful for first load / player change)
      if (frame.src !== cfg.gpv_url) {
        frame.src = cfg.gpv_url;
      }
    }
  } catch {}
}

function wsConnect() {
  try {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onmessage = (ev) => {
      // Regardless of what changed (skin or player), force a reload so GPV refetches CSS
      refresh(true);
    };

    ws.onclose = () => setTimeout(wsConnect, 1500);
  } catch {}
}

// Also react to localStorage broadcasts from other tabs
window.addEventListener('storage', (e) => {
  if (e.key === 'lgv_player' || e.key === 'lgv_skin') refresh(true);
});

wsConnect();
refresh(); // initial load
</script>
