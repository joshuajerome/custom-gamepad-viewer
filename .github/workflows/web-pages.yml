name: Web overlay (test + GitHub Pages)

# Tests the static overlay in web/ on every PR and deploys it to GitHub Pages
# when it changes on main or a web release branch.

on:
  push:
    branches: [ main, 'rel/web-**' ]
    paths: [ 'web/**', 'tests/web/**', 'package.json', '.github/workflows/web-pages.yml' ]
  pull_request:
    paths: [ 'web/**', 'tests/web/**', 'package.json', '.github/workflows/web-pages.yml' ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:web

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One Pages site per repo: never cancel a deploy midway.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
