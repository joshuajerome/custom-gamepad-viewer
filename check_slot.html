<!doctype html>
<meta charset="utf-8" />
<title>slot mapper</title>
<pre id="out">Connect/press a button…</pre>
<script>
const out = document.getElementById('out');

function dump() {
  const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];
  const lines = pads.map((g, i) => {
    if (!g) return `[${i}] empty`;
    return `[${i}] id="${g.id}" mapping=${g.mapping || 'none'} buttons=${g.buttons.length} axes=${g.axes.length}`;
  });
  out.textContent = lines.join('\n');
}

window.addEventListener('gamepadconnected', e => {
  out.textContent = `Connected at index ${e.gamepad.index}: ${e.gamepad.id}\n\n`;
  dump();
});

window.addEventListener('gamepaddisconnected', e => {
  out.textContent += `Disconnected index ${e.gamepad.index}: ${e.gamepad.id}\n\n`;
  dump();
});

// Poll to detect the one you're actually pressing
let last = [];
setInterval(() => {
  const pads = Array.from(navigator.getGamepads());
  pads.forEach((g, i) => {
    if (!g) return;
    const pressed = g.buttons.some(b => b && b.pressed);
    const moved = g.axes.some(a => Math.abs(a) > 0.15);
    if (pressed || moved) {
      out.textContent = `ACTIVE: index ${i} — ${g.id}\n\n`;
      dump();
    }
  });
}, 100);
</script>
