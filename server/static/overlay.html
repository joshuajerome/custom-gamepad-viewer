<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Overlay</title>
  <style>
    html,body,iframe {
      margin:0;
      border:0;
      height:100%;
      width:100%;
      background:transparent;
    }
  </style>
</head>
<body>
  <iframe id="gpv"
          src=""
          allow="gamepad *; clipboard-read; clipboard-write">
  </iframe>

  <script>
    const frame = document.getElementById('gpv');

    async function refresh() {
      try {
        const r = await fetch('/api/config', { cache:'no-store' });
        if (!r.ok) return;
        const cfg = await r.json();
        if (frame.src !== cfg.gpv_url) {
          frame.src = cfg.gpv_url;
        }
      } catch {}
    }

    // listen for config changes broadcast from control panel / slot checker
    window.addEventListener('storage', (e) => {
      if (e.key === 'lgv_player' || e.key === 'lgv_skin') {
        refresh();
      }
    });

    // load once at startup
    refresh();
  </script>
</body>
</html>
